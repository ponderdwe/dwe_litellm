# Local dev overrides — applied automatically by `docker-compose up -d`
# Sets DATABASE_URL for the local postgres container and adds db dependency.

services:
  litellm:
    environment:
      - DATABASE_URL=postgresql://litellm:litellm@db:5432/litellm
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: litellm_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
      - POSTGRES_DB=litellm
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  litellm_pgdata:
    external: false
